<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #201822;
            color: white;
            font-family: Arial, sans-serif;
        }
        /* container das cartas */
        main {
            width: 100%;
            padding: 40px 20px;
        }
        .categoria {
            width: 100%;
            margin-bottom: 60px;
        }
        .categoria h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .cartas {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }
        .flip-card {
            width: 300px;
            height: 450px;
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s ease-in-out;
        }
        /* flip */
        .flip-card.is-flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
        .flip-card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            display: block;
        }
        /* o hover funciona quando passa o mouse por cima do elemento */
        .flip-card:hover {
            transform: scale(1.02);
        }
        /* parte responsiva - ver melhor depois */
        @media (max-width: 600px) {
            main {
                padding: 30px 15px;
            }
            .flip-card {
                width: 250px;
                height: 375px;
            }
            .categoria h2 {
                font-size: 24px;
            }
        }
    </style> <!--colocar no css externo, evitar perder alguma configuração-->
</head>
